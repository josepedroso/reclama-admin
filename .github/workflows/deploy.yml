name: deploy

# Deploy MANUAL do painel admin (estático). Actions > deploy > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Mesma origem: o Nginx do admin faz proxy de /api para o backend, então a base é vazia.
      - run: npm run build
        env:
          VITE_API_URL: ""
      - name: Configurar SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Publicar release (symlink atômico)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
        run: |
          REL="/var/www/reclamaapp-admin/releases/${GITHUB_SHA::7}"
          SSH="ssh -i ~/.ssh/id_deploy"
          $SSH "$USER_@$HOST" "mkdir -p '$REL'"
          rsync -az --delete -e "$SSH" dist/ "$USER_@$HOST:$REL/"
          $SSH "$USER_@$HOST" "ln -sfn '$REL' /var/www/reclamaapp-admin/current && cd /var/www/reclamaapp-admin/releases && ls -1t | tail -n +6 | xargs -r rm -rf"
